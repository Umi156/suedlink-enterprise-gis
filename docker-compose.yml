services:
  db:
    image: postgis/postgis:16-3.4
    container_name: suedlink_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: suedlink_sdi
      POSTGRES_USER: gis_admin
      POSTGRES_PASSWORD: SuedLink2026Secure
    ports:
      - "5435:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: suedlink_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@suedlink-sdi.de
      PGADMIN_DEFAULT_PASSWORD: SuedLink2026Secure
    ports:
      - "5050:80"
    depends_on:
      - db

  streamlit_studio:
    build: .
    container_name: suedlink_streamlit
    restart: unless-stopped
    environment:
      DB_URL: postgresql+psycopg2://gis_admin:SuedLink2026Secure@db:5432/suedlink_sdi
    ports:
      - "8501:8501"
    depends_on:
      - db

  fastapi_webgis:
    build: .
    container_name: suedlink_fastapi
    restart: unless-stopped
    command: ["uvicorn", "webgis.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: suedlink_sdi
      DB_USER: gis_admin
      DB_PASS: SuedLink2026Secure
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgis_data:
